# Example Compose file for pose-detection.
# Every service builds the same image locally and differs only in the
# runtime BASE_PATH setting. Change the left-hand port if it is already
# in use on your machine.

services:
  # Example 1: Running at root path (default)
  pose-detection-root:
    build: .
    ports:
      - "8080:8080"
    environment:
      - BASE_PATH=/

  # Example 2: Running at /gait-detection subpath
  pose-detection-subpath:
    # Same local build - the subpath is configured at runtime
    build: .
    ports:
      - "8081:8080"
    environment:
      - BASE_PATH=/gait-detection

  # Example 3: Running at /apps/pose-detector subpath
  pose-detection-nested:
    # Same local build - the subpath is configured at runtime
    build: .
    ports:
      - "8082:8080"
    environment:
      - BASE_PATH=/apps/pose-detector
