apiVersion: apps/v1
kind: Deployment
metadata:
  name: gait-detection
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gait-detection
  template:
    metadata:
      labels:
        app: gait-detection
    spec:
      containers:
      - name: gait-detection
        image: gait-detection:latest
        ports:
        # nginx inside the image listens on 8080
        - containerPort: 8080
        env:
        # Configure the base path at runtime
        - name: BASE_PATH
          value: "/gait-detection"  # Change this to your desired path
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # The app serves its health endpoint at ${BASE_PATH}/health.
        # Update these paths if BASE_PATH changes.
        livenessProbe:
          httpGet:
            path: /gait-detection/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /gait-detection/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: gait-detection
  namespace: default
spec:
  selector:
    app: gait-detection
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP

---
# The app expects the full ${BASE_PATH} prefix on every request, so the
# ingresses below must forward the path unchanged (no rewrite or prefix strip).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gait-detection
  namespace: default
spec:
  ingressClassName: nginx
  rules:
  - host: example.com  # Change to your domain
    http:
      paths:
      - path: /gait-detection
        pathType: Prefix
        backend:
          service:
            name: gait-detection
            port:
              number: 80

---
# Alternative: Using Traefik
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gait-detection-traefik
  namespace: default
spec:
  ingressClassName: traefik
  rules:
  - host: example.com  # Change to your domain
    http:
      paths:
      - path: /gait-detection
        pathType: Prefix
        backend:
          service:
            name: gait-detection
            port:
              number: 80
