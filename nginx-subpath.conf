        # Health check endpoint for the configured public path
        location = ${BASE_PATH}/health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","service":"pose-detection-motion-tracking","timestamp":"$time_iso8601"}';
        }

        # Regex locations need a capture because the parent alias is not
        # inherited when nginx selects a nested regex location.
        location ~ ^${BASE_PATH}/(?<static_asset>.+\.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot))$ {
            alias /tmp/html/$static_asset;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;
        }

        location ~ ^${BASE_PATH}/(?<data_asset>.+\.(?:bin|json))$ {
            alias /tmp/html/$data_asset;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            add_header Vary Accept-Encoding;
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept";

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, OPTIONS";
                add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept";
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type "text/plain charset=UTF-8";
                add_header Content-Length 0;
                return 204;
            }
        }

        location ~ ^${BASE_PATH}/(?<html_asset>.+\.html)$ {
            alias /tmp/html/$html_asset;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Main application - SPA routing with subpath support
        location ${BASE_PATH}/ {
            # Basic rate limiting
            limit_req zone=static burst=20 nodelay;
            
            # Alias to serve files from the correct location
            alias /tmp/html/;
            
            # For directory access, serve index.html
            index index.html;
            
            # Try to serve request as file, then fall back to index.html for SPA routing
            try_files $uri $uri/index.html ${BASE_PATH}/index.html;
        }
        
        # Handle BASE_PATH without trailing slash (redirect to with slash)
        location = ${BASE_PATH} {
            # A relative redirect preserves the public host and port while
            # avoiding leaks of the container's internal listen port.
            return 301 ${BASE_PATH}/;
        }
